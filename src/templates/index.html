<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    </head>
    <body>
        <h1>Todo List</h1>

        <form action="/cadastrar-todo" method="POST">
            <label for="title">Título <span id="required">*</span></label
            ><br />
            <input type="text" name="title" id="title" required /><br /><br />
            <label for="description"
                >Descrição <span id="required">*</span></label
            ><br />
            <textarea name="description" id="description" required></textarea
            ><br /><br />
            <button>Cadastrar</button>
        </form>

        <br><hr><br>

        <h2>Minhas Tarefas</h2>

        {% for todo in todos %}
        <div class="todo">
            <h3>{{ todo.title }}</h3>
            <p>{{ todo.description }}</p>
            <span>{{ todo.created_at.strftime("%B %d, %Y") }}</span>
            <a href="/deletar-task/{{ todo.id }}"><i class="bi bi-trash3"></i></a>
        </div>
        <hr>
        {% endfor %}

    </body>
</html>
